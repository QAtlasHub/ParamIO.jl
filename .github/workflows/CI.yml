name: CI
on:
  push: { branches: [main] }
  pull_request: {}

# Calls TestShards.jl directly, retiring this repository's use of the org's julia-ci.yml — which
# is a third hand-written copy of the same sharded-test vertical (a plan job, a coverage merge, a
# timing recorder) and is being deleted once its three callers have moved.
#
# Nothing is planned up front: each shard decides what it owns from the same timing history. The
# reusable merges the shards' coverage into one report, merges their records into one ordered
# document, checks that every unit ran exactly once, and refreshes `ci-timings` on pushes to main.
jobs:
  test:
    permissions:
      contents: write   # the timing history is pushed to the `ci-timings` orphan branch
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      # Nine units. The diagnosis printed on every run names the knee for this suite; set what
      # it says rather than what looks tidy.
      shards: 4
    # Named rather than inherited: handing an entire secret store to another repository's
    # workflow for one optional token is the wrong shape. Whether it ARRIVES is being measured
    # on DataVault.jl#36 — a secret did not survive this call from a different ORGANISATION
    # (lab-sotashimozono/ITensorAD.jl#20), and both this repo and that probe are same-org. If
    # `collect` warns that no token reached it, add the caller-side upload job
    # (QAtlasHub/TestShards.jl/actions/upload-coverage). See QAtlasHub/TestShards.jl#48.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
